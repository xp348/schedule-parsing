<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      ;(() => {
        let saved
        try {
          saved = localStorage.getItem("campus:theme:v1")
        } catch {}
        const dark =
          saved === "dark" ||
          (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
      })()
    </script>
    <meta
      name="description"
      content="Свободные аудитории ЗГУ. Выберите день и время, чтобы проверить занятость по расписанию."
    />
    <title>Кампус · Свободные аудитории</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
