<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Поиск по расписанию</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f3f6fa;
        color: #18283b;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        width: min(1280px, 100%);
        margin: 0 auto;
        padding: 48px 24px;
      }
      .eyebrow {
        color: #32635f;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 10px 0;
        font-size: clamp(1.8rem, 5vw, 2.8rem);
        line-height: 1.2;
      }
      .intro {
        color: #526174;
        margin: 0 0 28px;
      }
      form {
        padding: 24px;
        background: white;
        border: 1px solid #dce3ed;
        border-radius: 16px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .controls {
        display: flex;
        gap: 12px;
      }
      input,
      button {
        font: inherit;
        min-height: 48px;
        border-radius: 8px;
      }
      input {
        flex: 1;
        min-width: 0;
        width: 100%;
        padding: 12px;
        border: 1px solid #98a7b8;
      }
      button {
        border: 0;
        padding: 12px 28px;
        background: #175c54;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #104a44;
      }
      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      :focus-visible {
        outline: 3px solid #377ded;
        outline-offset: 3px;
      }
      #status {
        margin: 20px 0;
        color: #526174;
        overflow-wrap: anywhere;
      }
      #status.error {
        color: #a32424;
      }
      .table-hint {
        display: none;
        margin: 0 0 10px;
        color: #526174;
        font-size: 0.85rem;
      }
      .table-wrap {
        max-width: 100%;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        border: 1px solid #dce3ed;
        border-radius: 12px;
        background: white;
      }
      table {
        width: 100%;
        min-width: 1080px;
        border-collapse: collapse;
        text-align: left;
        table-layout: fixed;
      }
      col.sheet-column {
        width: 88px;
      }
      col.day-column {
        width: 160px;
      }
      col.time-column {
        width: 188px;
      }
      col.group-column {
        width: 112px;
      }
      col.cell-column {
        width: 98px;
      }
      col.content-column {
        width: auto;
      }
      col.room-column {
        width: 92px;
      }
      caption {
        padding: 18px 18px 16px;
        text-align: left;
        font-weight: 700;
        border-bottom: 1px solid #dce3ed;
      }
      th {
        background: #eaf0f5;
        color: #43536a;
        font-size: 0.85rem;
        white-space: nowrap;
      }
      th,
      td {
        padding: 16px 18px;
        vertical-align: top;
        border-bottom: 1px solid #e3e9f0;
        overflow-wrap: normal;
        word-break: normal;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tbody tr:nth-child(even) {
        background: #f8fafc;
      }
      tbody tr:hover {
        background: #f0f7f5;
      }
      tbody tr.day-start td {
        border-top: 2px solid #b9cadc;
      }
      .sheet-name {
        overflow-wrap: anywhere;
        color: #526174;
        display: inline-block;
        line-height: 1.35;
      }
      .day-badge,
      .group-badge,
      .room-badge {
        display: inline-flex;
        align-items: center;
        border-radius: 6px;
        font-weight: 700;
        line-height: 1.2;
        white-space: nowrap;
      }
      .day-badge {
        background: #e7f0ff;
        color: #244c7c;
        padding: 5px 8px;
      }
      .time-value {
        align-items: center;
        color: #10243a;
        display: inline-flex;
        gap: 8px;
        font-weight: 800;
        white-space: nowrap;
      }
      .pair-badge {
        background: #edf2f7;
        border: 1px solid #d6e0eb;
        border-radius: 999px;
        color: #43536a;
        font-size: 0.76rem;
        font-weight: 700;
        line-height: 1;
        padding: 5px 7px;
      }
      .group-badge {
        text-wrap: wrap;
        background: #edf7ef;
        border: 1px solid #cfe5d3;
        color: #285739;
        padding: 4px 7px;
      }
      .cell-ref {
        color: #526174;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.9rem;
        white-space: nowrap;
      }
      .lesson-content {
        color: #10243a;
        display: inline-block;
        line-height: 1.45;
        max-width: 42ch;
      }
      .room-badge {
        background: #fff4df;
        border: 1px solid #ecd8af;
        color: #684b13;
        padding: 4px 7px;
      }
      .empty-value {
        color: #7a8797;
      }
      td:nth-child(2),
      td:nth-child(3),
      td:nth-child(4),
      td:nth-child(5),
      td:nth-child(7) {
        white-space: nowrap;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 900px) {
        .table-hint {
          display: block;
        }
      }
      @media (max-width: 640px) {
        main {
          padding: 28px 16px;
        }
        form {
          padding: 18px;
        }
        .controls {
          flex-direction: column;
        }
        table {
          min-width: 980px;
          font-size: 0.875rem;
        }
        caption {
          padding: 12px;
        }
        th,
        td {
          padding: 10px 12px;
        }
        th {
          font-size: 0.8rem;
          white-space: nowrap;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Расписание занятий</div>
      <h1>Найдите своё расписание</h1>
      <p class="intro">
        Введите фамилию преподавателя, группу или название дисциплины.
      </p>
      <form id="search-form">
        <label for="keyword">Что ищем?</label>
        <div class="controls">
          <input
            id="keyword"
            name="keyword"
            type="search"
            placeholder="Например, Иванов"
            required
            aria-describedby="status"
          />
          <button type="submit">Найти расписание</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite">
        Результаты поиска появятся здесь.
      </p>
      <div id="results" hidden>
        <p class="table-hint">
          Проведите по таблице влево или вправо, чтобы увидеть все столбцы.
        </p>
        <div
          class="table-wrap"
          tabindex="0"
          role="region"
          aria-label="Результаты поиска — таблица с горизонтальной прокруткой"
        >
          <table role="table">
            <colgroup>
              <col class="sheet-column" />
              <col class="day-column" />
              <col class="time-column" />
              <col class="group-column" />
              <col class="cell-column" />
              <col class="content-column" />
              <col class="room-column" />
            </colgroup>
            <caption>
              Найденные занятия
            </caption>
            <thead role="rowgroup">
              <tr role="row">
                <th scope="col" role="columnheader">Лист</th>
                <th scope="col" role="columnheader">День</th>
                <th scope="col" role="columnheader">Время</th>
                <th scope="col" role="columnheader">Группа</th>
                <th scope="col" role="columnheader">Ячейка</th>
                <th scope="col" role="columnheader">Содержимое</th>
                <th scope="col" role="columnheader">Ауд</th>
              </tr>
            </thead>
            <tbody role="rowgroup"></tbody>
          </table>
        </div>
      </div>
      <noscript>Для поиска включите JavaScript в браузере.</noscript>
    </main>
    <script>
      const form = document.querySelector("#search-form");
      const input = document.querySelector("#keyword");
      const button = form.querySelector("button");
      const status = document.querySelector("#status");
      const results = document.querySelector("#results");
      const tbody = results.querySelector("tbody");
      const columns = [
        "Лист",
        "День",
        "Время",
        "Группа",
        "Ячейка",
        "Содержимое",
        "Ауд",
      ];
      const columnStyles = {
        Лист: "sheet-name",
        День: "day-badge",
        Время: "time-value",
        Группа: "group-badge",
        Ячейка: "cell-ref",
        Содержимое: "lesson-content",
        Ауд: "room-badge",
      };
      const lessonStarts = [
        { number: 1, minutes: 8 * 60 + 40 },
        { number: 2, minutes: 10 * 60 + 20 },
        { number: 3, minutes: 12 * 60 + 10 },
        { number: 4, minutes: 13 * 60 + 50 },
        { number: 5, minutes: 15 * 60 + 30 },
        { number: 6, minutes: 17 * 60 + 10 },
        { number: 7, minutes: 18 * 60 + 50 },
        { number: 8, minutes: 20 * 60 + 30 },
      ];
      const lessonStartTolerance = 20;
      let loading = false;

      function getLessonNumber(time) {
        const match = String(time).match(/(\d{1,2})[.:](\d{2})/);
        if (!match) return null;

        const startMinutes = Number(match[1]) * 60 + Number(match[2]);
        const nearest = lessonStarts.reduce((closest, lesson) => {
          const distance = Math.abs(lesson.minutes - startMinutes);
          return distance < closest.distance
            ? { number: lesson.number, distance }
            : closest;
        }, { number: null, distance: Number.POSITIVE_INFINITY });

        return nearest.distance <= lessonStartTolerance ? nearest.number : null;
      }

      function renderTimeValue(rawValue) {
        const value = document.createElement("span");
        value.className = "time-value";
        
        const lessonNumber = getLessonNumber(rawValue);
        if (lessonNumber !== null) {
          const pair = document.createElement("span");
          pair.className = "pair-badge";
          pair.textContent = `${lessonNumber} пара`;
          value.append(pair);
        }

        const time = document.createElement("span");
        time.textContent = String(rawValue);
        value.append(time);

        return value;
      }

      function renderValue(item, column) {
        const rawValue = item[column];
        const isEmpty = rawValue === "" || rawValue == null;
        if (!isEmpty && column === "Время") return renderTimeValue(rawValue);

        const value = document.createElement("span");
        value.className = isEmpty ? "empty-value" : columnStyles[column];
        value.textContent = isEmpty ? "—" : String(rawValue);
        return value;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (loading) return;
        const keyword = input.value.trim();
        if (!keyword) {
          status.textContent = "Введите текст для поиска.";
          status.className = "error";
          input.focus();
          return;
        }
        loading = true;
        button.disabled = true;
        button.textContent = "Ищем…";
        results.hidden = true;
        tbody.replaceChildren();
        form.setAttribute("aria-busy", "true");
        status.className = "";
        status.textContent =
          "Загружаем расписание и ищем совпадения. Это может занять некоторое время…";
        try {
          const response = await fetch(
            `/schedule?${new URLSearchParams({ keyword })}`,
            {
              headers: { Accept: "application/json" },
            },
          );
          const data = await response.json().catch(() => null);
          if (!response.ok) {
            throw new Error(
              typeof data?.detail === "string"
                ? data.detail
                : `Ошибка сервера (${response.status}). Попробуйте ещё раз.`,
            );
          }
          if (!Array.isArray(data))
            throw new Error(
              "Сервер вернул неожиданный ответ. Попробуйте ещё раз.",
            );
          const fragment = document.createDocumentFragment();
          let previousDay = "";
          for (const item of data) {
            const row = document.createElement("tr");
            const day = String(item["День"] || "").trim().toLowerCase();
            if (day && day !== previousDay) {
              row.classList.add("day-start");
              previousDay = day;
            }
            row.setAttribute("role", "row");
            for (const column of columns) {
              const cell = document.createElement("td");
              cell.setAttribute("role", "cell");
              cell.append(renderValue(item, column));
              row.append(cell);
            }
            fragment.append(row);
          }
          tbody.append(fragment);
          results.hidden = data.length === 0;
          results.querySelector(".table-wrap").scrollLeft = 0;
          status.textContent = data.length
            ? `Результатов: ${data.length}. Поиск: «${keyword}».`
            : `По запросу «${keyword}» ничего не найдено. Попробуйте другое слово.`;
        } catch (error) {
          status.className = "error";
          status.textContent =
            error instanceof TypeError
              ? "Не удалось связаться с сервером. Проверьте соединение и повторите поиск."
              : error.message;
        } finally {
          loading = false;
          button.disabled = false;
          button.textContent = "Найти расписание";
          form.setAttribute("aria-busy", "false");
        }
      });
    </script>
  </body>
</html>
