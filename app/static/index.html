<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Поиск по расписанию</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f3f6fa;
        color: #18283b;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        width: min(1280px, 100%);
        margin: 0 auto;
        padding: 48px 24px;
      }
      .eyebrow {
        color: #32635f;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 10px 0;
        font-size: clamp(1.8rem, 5vw, 2.8rem);
        line-height: 1.2;
      }
      .intro {
        color: #526174;
        margin: 0 0 28px;
      }
      form {
        padding: 24px;
        background: white;
        border: 1px solid #dce3ed;
        border-radius: 16px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .controls {
        display: flex;
        gap: 12px;
      }
      input,
      button {
        font: inherit;
        min-height: 48px;
        border-radius: 8px;
      }
      input {
        flex: 1;
        min-width: 0;
        width: 100%;
        padding: 12px;
        border: 1px solid #98a7b8;
      }
      button {
        border: 0;
        padding: 12px 28px;
        background: #175c54;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #104a44;
      }
      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      :focus-visible {
        outline: 3px solid #377ded;
        outline-offset: 3px;
      }
      #status {
        margin: 20px 0;
        color: #526174;
        overflow-wrap: anywhere;
      }
      #status.error {
        color: #a32424;
      }
      .table-hint {
        display: none;
        margin: 0 0 10px;
        color: #526174;
        font-size: 0.85rem;
      }
      .table-wrap {
        max-width: 100%;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        border: 1px solid #dce3ed;
        border-radius: 12px;
        background: white;
      }
      table {
        width: 100%;
        min-width: 1080px;
        border-collapse: separate;
        border-spacing: 0;
        text-align: left;
        table-layout: fixed;
      }
      col.day-column {
        width: 86px;
      }
      col.time-column {
        width: 204px;
      }
      col.content-column {
        width: auto;
      }
      col.group-column {
        width: 128px;
      }
      col.room-column {
        width: 128px;
      }
      caption {
        padding: 18px 18px 16px;
        text-align: left;
        font-weight: 700;
        border-bottom: 1px solid #dce3ed;
      }
      .caption-row {
        align-items: center;
        display: flex;
        gap: 16px;
        justify-content: space-between;
      }
      .caption-actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: flex-end;
      }
      .toggle-control {
        align-items: center;
        color: #43536a;
        cursor: pointer;
        display: inline-flex;
        font-size: 0.82rem;
        font-weight: 700;
        gap: 8px;
        line-height: 1;
        white-space: nowrap;
      }
      .toggle-control input {
        block-size: 18px;
        inline-size: 18px;
        margin: 0;
      }
      .week-indicator {
        background: #edf2f7;
        border: 1px solid #d6e0eb;
        border-radius: 999px;
        color: #43536a;
        font-size: 0.82rem;
        font-weight: 800;
        line-height: 1;
        padding: 7px 10px;
        white-space: nowrap;
      }
      th {
        background: #eaf0f5;
        color: #43536a;
        font-size: 0.85rem;
        white-space: nowrap;
      }
      th,
      td {
        padding: 14px 16px;
        vertical-align: middle;
        border-right: 1px solid #d7e0ea;
        border-bottom: 1px solid #d7e0ea;
        overflow-wrap: normal;
        word-break: normal;
      }
      th:last-child,
      td:last-child {
        border-right: 0;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tbody tr:nth-child(even) {
        background: #f8fafc;
      }
      tbody tr:hover {
        background: #f0f7f5;
      }
      tbody tr.day-start td,
      tbody tr.day-start th {
        border-top: 2px solid #9eb4cc;
      }
      .day-cell {
        background: #f7fafc;
        color: #10243a;
        height: 1px;
        font-size: 1.08rem;
        font-weight: 800;
        letter-spacing: 0;
        padding: 0;
        text-align: center;
        vertical-align: middle;
      }
      .day-cell-inner {
        align-items: center;
        display: grid;
        height: 100%;
        justify-content: center;
        min-height: 100%;
        place-items: center;
        width: 100%;
      }
      .day-label {
        block-size: max-content;
        display: block;
        inline-size: max-content;
        line-height: 1;
        text-align: center;
        transform: rotate(-90deg);
        transform-origin: center;
        white-space: nowrap;
      }
      .group-badge,
      .room-badge {
        display: inline-flex;
        align-items: center;
        border-radius: 6px;
        font-weight: 700;
        line-height: 1.2;
        white-space: nowrap;
      }
      .time-value {
        align-items: center;
        color: #10243a;
        display: inline-flex;
        gap: 8px;
        font-weight: 800;
        white-space: nowrap;
      }
      .pair-badge {
        background: #edf2f7;
        border: 1px solid #d6e0eb;
        border-radius: 999px;
        color: #43536a;
        font-size: 0.76rem;
        font-weight: 700;
        line-height: 1;
        padding: 5px 7px;
      }
      .lesson-stack {
        display: grid;
        gap: 10px;
      }
      .week-split {
        display: grid;
        gap: 6px;
      }
      .week-label {
        color: #43536a;
        font-size: 0.76rem;
        font-weight: 800;
        line-height: 1;
        text-transform: uppercase;
      }
      .week-values {
        display: grid;
        gap: 7px;
      }
      .group-badge {
        text-wrap: wrap;
        background: #edf7ef;
        border: 1px solid #cfe5d3;
        color: #285739;
        padding: 4px 7px;
      }
      .lesson-content {
        color: #10243a;
        display: inline-block;
        line-height: 1.45;
        max-width: 56ch;
      }
      .room-badge {
        background: #fff4df;
        border: 1px solid #ecd8af;
        color: #684b13;
        padding: 4px 7px;
      }
      td:nth-child(4),
      td:nth-child(5) {
        white-space: nowrap;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 900px) {
        .table-hint {
          display: block;
        }
      }
      @media (max-width: 640px) {
        main {
          padding: 28px 16px;
        }
        form {
          padding: 18px;
        }
        .controls {
          flex-direction: column;
        }
        table {
          min-width: 980px;
          font-size: 0.875rem;
        }
        caption {
          padding: 12px;
        }
        th,
        td {
          padding: 10px 12px;
        }
        th {
          font-size: 0.8rem;
          white-space: nowrap;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Расписание занятий</div>
      <h1>Найдите своё расписание</h1>
      <p class="intro">
        Введите фамилию преподавателя, группу или название дисциплины.
      </p>
      <form id="search-form">
        <label for="keyword">Что ищем?</label>
        <div class="controls">
          <input
            id="keyword"
            name="keyword"
            type="search"
            placeholder="Например, Иванов"
            required
            aria-describedby="status"
          />
          <button type="submit">Найти расписание</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite">
        Результаты поиска появятся здесь.
      </p>
      <div id="results" hidden>
        <p class="table-hint">
          Проведите по таблице влево или вправо, чтобы увидеть все столбцы.
        </p>
        <div
          class="table-wrap"
          tabindex="0"
          role="region"
          aria-label="Результаты поиска — таблица с горизонтальной прокруткой"
        >
          <table role="table">
            <colgroup>
              <col class="day-column" />
              <col class="time-column" />
              <col class="content-column" />
              <col class="group-column" />
              <col class="room-column" />
            </colgroup>
            <caption>
              <span class="caption-row">
                <span>Найденные занятия</span>
                <span class="caption-actions">
                  <label class="toggle-control" for="show-empty-rows">
                    <input id="show-empty-rows" type="checkbox" />
                    Пустые строки
                  </label>
                  <label class="toggle-control" for="show-current-week-only">
                    <input id="show-current-week-only" type="checkbox" />
                    Расписание с учетом чётности недели
                  </label>
                  <label class="toggle-control" for="show-next-week">
                    <input id="show-next-week" type="checkbox" />
                    Следующая неделя
                  </label>
                  <span id="week-indicator" class="week-indicator"></span>
                </span>
              </span>
            </caption>
            <thead role="rowgroup">
              <tr role="row">
                <th scope="col" role="columnheader">День</th>
                <th scope="col" role="columnheader">Время</th>
                <th scope="col" role="columnheader">Содержимое</th>
                <th scope="col" role="columnheader">Группа</th>
                <th scope="col" role="columnheader">Ауд</th>
              </tr>
            </thead>
            <tbody role="rowgroup"></tbody>
          </table>
        </div>
      </div>
      <noscript>Для поиска включите JavaScript в браузере.</noscript>
    </main>
    <script>
      const form = document.querySelector("#search-form");
      const input = document.querySelector("#keyword");
      const button = form.querySelector("button");
      const status = document.querySelector("#status");
      const results = document.querySelector("#results");
      const tbody = results.querySelector("tbody");
      const showEmptyRows = document.querySelector("#show-empty-rows");
      const showCurrentWeekOnly = document.querySelector("#show-current-week-only");
      const showNextWeek = document.querySelector("#show-next-week");
      const weekIndicator = document.querySelector("#week-indicator");
      const weekdays = [
        "понедельник",
        "вторник",
        "среда",
        "четверг",
        "пятница",
        "суббота",
        "воскресенье",
      ];
      const lessonStarts = [
        { number: 1, minutes: 8 * 60 + 40, label: "8.40 - 10.10" },
        { number: 2, minutes: 10 * 60 + 20, label: "10.20 - 11.50" },
        { number: 3, minutes: 12 * 60 + 10, label: "12.10 - 13.40" },
        { number: 4, minutes: 13 * 60 + 50, label: "13.50 - 15.20" },
        { number: 5, minutes: 15 * 60 + 30, label: "15.30 - 17.00" },
        { number: 6, minutes: 17 * 60 + 10, label: "17.10 - 18.40" },
        { number: 7, minutes: 18 * 60 + 50, label: "18.50 - 20.20" },
        { number: 8, minutes: 20 * 60 + 30, label: "20.30 - 22.00" },
      ];
      const weekBuckets = [
        { id: "odd", label: "Нечётная", className: "odd-week" },
        { id: "even", label: "Чётная", className: "even-week" },
        { id: "every", label: "Каждую неделю", className: "every-week" },
      ];
      const academicStartDate = new Date(2026, 8, 1);
      const lessonStartTolerance = 20;
      let loading = false;
      let lastResults = [];

      function hasValue(value) {
        return value != null && String(value).trim() !== "";
      }

      function normalizeDay(day) {
        return String(day || "").trim().toLowerCase();
      }

      function normalizeText(value) {
        return String(value || "").trim().toLowerCase().replaceAll("ё", "е");
      }

      function getAcademicWeekNumber(date = new Date()) {
        const start = new Date(academicStartDate);
        const current = new Date(date);
        start.setHours(0, 0, 0, 0);
        current.setHours(0, 0, 0, 0);
        const startWeekMonday = new Date(start);
        const startDay = startWeekMonday.getDay() || 7;
        startWeekMonday.setDate(startWeekMonday.getDate() - startDay + 1);

        const currentWeekMonday = new Date(current);
        const currentDay = currentWeekMonday.getDay() || 7;
        currentWeekMonday.setDate(currentWeekMonday.getDate() - currentDay + 1);

        const days = Math.floor((currentWeekMonday - startWeekMonday) / 86400000);
        return Math.max(1, Math.floor(days / 7) + 1);
      }

      function getSelectedWeekNumber() {
        return getAcademicWeekNumber() + (showNextWeek.checked ? 1 : 0);
      }

      function getSelectedWeekBucket() {
        return getSelectedWeekNumber() % 2 === 0 ? "even" : "odd";
      }

      function updateWeekIndicator() {
        const weekNumber = getSelectedWeekNumber();
        weekIndicator.textContent = `${weekNumber} неделя`;
        weekIndicator.title = showNextWeek.checked
          ? `Следующая учебная неделя №${weekNumber} от 01.09.2026`
          : `Учебная неделя №${weekNumber} от 01.09.2026`;
      }

      function getWeekBucket(item) {
        const content = normalizeText(item["Содержимое"]);
        if (/^н\.\s*/.test(content)) return "odd";
        if (/^ч\.\s*/.test(content)) return "even";
        return "every";
      }

      function getVisibleItems(items) {
        if (!showCurrentWeekOnly.checked) return items;
        const selectedWeekBucket = getSelectedWeekBucket();
        return items.filter((item) => {
          const bucket = getWeekBucket(item);
          return bucket === "every" || bucket === selectedWeekBucket;
        });
      }

      function getDisplayValue(item, field) {
        const value = String(item[field]);
        if (field === "Содержимое") {
          return value.trim().replace(/^[нч]\.\s*/i, "");
        }
        return value;
      }

      function getLessonSlot(time) {
        const match = String(time).match(/(\d{1,2})[.:](\d{2})/);
        if (!match) return null;

        const startMinutes = Number(match[1]) * 60 + Number(match[2]);
        const nearest = lessonStarts.reduce((closest, lesson) => {
          const distance = Math.abs(lesson.minutes - startMinutes);
          return distance < closest.distance
            ? { number: lesson.number, distance }
            : closest;
        }, { number: null, distance: Number.POSITIVE_INFINITY });

        return nearest.distance <= lessonStartTolerance ? nearest.number : null;
      }

      function renderTimeValue(label, lessonNumber = null) {
        const value = document.createElement("span");
        value.className = "time-value";

        if (lessonNumber !== null) {
          const pair = document.createElement("span");
          pair.className = "pair-badge";
          pair.textContent = `${lessonNumber} пара`;
          value.append(pair);
        }

        const time = document.createElement("span");
        if (label) {
          time.textContent = label;
          value.append(time);
        }

        return value;
      }

      function renderLessonStack(items, field, className) {
        const stack = document.createElement("div");
        stack.className = "lesson-stack";

        for (const item of items) {
          if (!hasValue(item[field])) continue;
          const value = document.createElement("span");
          value.className = className;
          value.textContent = getDisplayValue(item, field);
          stack.append(value);
        }

        return stack;
      }

      function hasWeekSpecificItems(items) {
        return items.some((item) => getWeekBucket(item) !== "every");
      }

      function renderWeekSplitStack(items, field, className, showLabels) {
        if (!hasWeekSpecificItems(items)) {
          return renderLessonStack(items, field, className);
        }

        const split = document.createElement("div");
        split.className = "week-split";

        for (const bucket of weekBuckets) {
          const bucketItems = items.filter((item) => getWeekBucket(item) === bucket.id);
          const values = bucketItems.filter((item) => hasValue(item[field]));
          if (values.length === 0) continue;

          const row = document.createElement("div");
          row.className = "week-row";
          row.title = `Учебная неделя №${getSelectedWeekNumber()} от 01.09.2026`;

          if (showLabels) {
            const label = document.createElement("span");
            label.className = "week-label";
            label.textContent = bucket.label;
            row.append(label);
          }

          const valueStack = document.createElement("div");
          valueStack.className = "week-values";
          for (const item of values) {
            const value = document.createElement("span");
            value.className = className;
            value.textContent = getDisplayValue(item, field);
            valueStack.append(value);
          }
          row.append(valueStack);
          split.append(row);
        }

        return split;
      }

      function groupByDay(data) {
        const groups = new Map();
        for (const item of data) {
          const normalizedDay = normalizeDay(item["День"]);
          const key = normalizedDay || "без дня";
          if (!groups.has(key)) {
            groups.set(key, {
              label: hasValue(item["День"]) ? String(item["День"]).trim() : "",
              items: [],
            });
          }
          groups.get(key).items.push(item);
        }

        return [...groups.entries()].sort(([left], [right]) => {
          const leftIndex = weekdays.indexOf(left);
          const rightIndex = weekdays.indexOf(right);
          return (leftIndex === -1 ? weekdays.length : leftIndex)
            - (rightIndex === -1 ? weekdays.length : rightIndex);
        });
      }

      function renderCell(row, children) {
        const cell = document.createElement("td");
        cell.setAttribute("role", "cell");
        for (const child of children) cell.append(child);
        row.append(cell);
        return cell;
      }

      function dayLabelBlockSize(day) {
        return `${Math.max(String(day).length + 1, 5)}ch`;
      }

      function rowHasContent(scheduleRow) {
        return getVisibleItems(scheduleRow.items).some((item) =>
          hasValue(item["Содержимое"])
        );
      }

      function renderDayGroup(fragment, group) {
        const rows = [];
        const bySlot = new Map(lessonStarts.map((lesson) => [lesson.number, []]));
        const unslotted = [];

        for (const item of group.items) {
          const slot = getLessonSlot(item["Время"]);
          if (slot === null) {
            unslotted.push(item);
          } else {
            bySlot.get(slot).push(item);
          }
        }

        for (const lesson of lessonStarts) {
          rows.push({
            label: lesson.label,
            lessonNumber: lesson.number,
            items: bySlot.get(lesson.number),
          });
        }

        for (const item of unslotted) {
          rows.push({
            label: hasValue(item["Время"]) ? String(item["Время"]) : "",
            lessonNumber: null,
            items: [item],
          });
        }

        const visibleRows = showEmptyRows.checked
          ? rows
          : rows.filter(rowHasContent);
        if (visibleRows.length === 0) return;

        visibleRows.forEach((scheduleRow, index) => {
          const row = document.createElement("tr");
          const visibleItems = getVisibleItems(scheduleRow.items);
          row.setAttribute("role", "row");
          if (index === 0) {
            row.classList.add("day-start");
            const day = document.createElement("th");
            day.className = "day-cell";
            day.scope = "rowgroup";
            day.rowSpan = visibleRows.length;
            const dayInner = document.createElement("span");
            dayInner.className = "day-cell-inner";
            dayInner.style.minHeight = dayLabelBlockSize(group.label);
            const dayLabel = document.createElement("span");
            dayLabel.className = "day-label";
            dayLabel.textContent = group.label;
            dayInner.append(dayLabel);
            day.append(dayInner);
            row.append(day);
          }

          renderCell(row, [
            renderTimeValue(scheduleRow.label, scheduleRow.lessonNumber),
          ]);
          renderCell(row, [
            renderWeekSplitStack(
              visibleItems,
              "Содержимое",
              "lesson-content",
              true,
            ),
          ]);
          renderCell(row, [
            renderWeekSplitStack(visibleItems, "Группа", "group-badge", false),
          ]);
          renderCell(row, [
            renderWeekSplitStack(visibleItems, "Ауд", "room-badge", false),
          ]);
          fragment.append(row);
        });
      }

      function renderSchedule(data) {
        tbody.replaceChildren();
        const fragment = document.createDocumentFragment();
        for (const [, group] of groupByDay(data)) {
          renderDayGroup(fragment, group);
        }
        tbody.append(fragment);
        results.hidden = data.length === 0;
        results.querySelector(".table-wrap").scrollLeft = 0;
      }

      updateWeekIndicator();

      showEmptyRows.addEventListener("change", () => {
        renderSchedule(lastResults);
      });
      showCurrentWeekOnly.addEventListener("change", () => {
        renderSchedule(lastResults);
      });
      showNextWeek.addEventListener("change", () => {
        updateWeekIndicator();
        renderSchedule(lastResults);
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (loading) return;
        const keyword = input.value.trim();
        if (!keyword) {
          status.textContent = "Введите текст для поиска.";
          status.className = "error";
          input.focus();
          return;
        }
        loading = true;
        button.disabled = true;
        button.textContent = "Ищем…";
        results.hidden = true;
        tbody.replaceChildren();
        form.setAttribute("aria-busy", "true");
        status.className = "";
        status.textContent =
          "Загружаем расписание и ищем совпадения. Это может занять некоторое время…";
        try {
          const response = await fetch(
            `/schedule?${new URLSearchParams({ keyword })}`,
            {
              headers: { Accept: "application/json" },
            },
          );
          const data = await response.json().catch(() => null);
          if (!response.ok) {
            throw new Error(
              typeof data?.detail === "string"
                ? data.detail
                : `Ошибка сервера (${response.status}). Попробуйте ещё раз.`,
            );
          }
          if (!Array.isArray(data))
            throw new Error(
              "Сервер вернул неожиданный ответ. Попробуйте ещё раз.",
            );
          lastResults = data;
          renderSchedule(data);
          status.textContent = data.length
            ? `Результатов: ${data.length}. Поиск: «${keyword}».`
            : `По запросу «${keyword}» ничего не найдено. Попробуйте другое слово.`;
        } catch (error) {
          status.className = "error";
          status.textContent =
            error instanceof TypeError
              ? "Не удалось связаться с сервером. Проверьте соединение и повторите поиск."
              : error.message;
        } finally {
          loading = false;
          button.disabled = false;
          button.textContent = "Найти расписание";
          form.setAttribute("aria-busy", "false");
        }
      });
    </script>
  </body>
</html>
