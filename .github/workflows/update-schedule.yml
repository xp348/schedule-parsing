name: Обновление расписания

on:
  schedule:
    - cron: "30 9-17 * * 1-5"
      timezone: Asia/Krasnoyarsk
    - cron: "0 10-18 * * 1-5"
      timezone: Asia/Krasnoyarsk
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-schedule-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_WORKTREE: ${{ runner.temp }}/schedule-data

    steps:
      - name: Получить код из основной ветки
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Установить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Установить зависимости
        run: |
          python -m pip install uv
          uv sync --frozen

      - name: Получить расписание и сохранить журнал
        run: uv run --frozen python export_schedule.py

      - name: Подготовить ветку data
        run: |
          git ls-remote --heads origin refs/heads/data > "$RUNNER_TEMP/data-ref"

          if [ -s "$RUNNER_TEMP/data-ref" ]; then
            git fetch origin refs/heads/data
            git worktree add --detach "$DATA_WORKTREE" FETCH_HEAD
          else
            git worktree add --detach "$DATA_WORKTREE" HEAD
            git -C "$DATA_WORKTREE" switch --orphan data
          fi

      - name: Сравнить данные и сохранить изменения
        run: |
          cp output/schedule.json "$DATA_WORKTREE/schedule.json"
          git -C "$DATA_WORKTREE" add -- schedule.json

          if git -C "$DATA_WORKTREE" diff --cached --quiet -- schedule.json; then
            echo "Расписание не изменилось"
            exit 0
          fi

          cp logs/schedule.log "$DATA_WORKTREE/schedule.log"
          git -C "$DATA_WORKTREE" add -- schedule.log
          git -C "$DATA_WORKTREE" config user.name "github-actions[bot]"
          git -C "$DATA_WORKTREE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$DATA_WORKTREE" commit -m "Обновить расписание"
          git -C "$DATA_WORKTREE" push origin HEAD:refs/heads/data

      - name: Сохранить файл журнала запуска
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: schedule-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/schedule.log
          if-no-files-found: warn
          retention-days: 30
