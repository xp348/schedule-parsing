name: Публикация сайта

on:
  push:
    branches: [front]
  workflow_dispatch:
  workflow_run:
    workflows: [Обновление расписания]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Получить фронтенд из ветки front
        uses: actions/checkout@v7
        with:
          ref: front

      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Получить актуальное расписание из data
        run: |
          git fetch origin refs/heads/data:refs/remotes/origin/data
          npm run prepare:data

      - name: Проверить фронтенд
        run: npm test

      - name: Собрать сайт
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Настроить Pages
        uses: actions/configure-pages@v6

      - name: Загрузить сборку
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v5
